# Yeni sürüm etiketi (ör. v3.4) gönderilince Linux .deb ve Windows kurulum dosyalarını
# derler, GitHub "Releases" sayfasında yayınlar ve surum.json'u günceller.
name: Yayınla

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sürüm etiketle uyumlu mu?
        run: |
          VER=$(grep -oP '^VERSION = "\K[^"]+' ytmp3.py)
          test "v$VER" = "${GITHUB_REF_NAME}" || { echo "ytmp3.py VERSION ($VER) etiketle ($GITHUB_REF_NAME) uyuşmuyor"; exit 1; }
      - name: .deb paketi
        run: PY=python bash paket/deb_olustur.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.deb"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kütüphaneler
        run: python -m pip install pyinstaller yt-dlp customtkinter qrcode
      - name: ffmpeg indir
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = Get-ChildItem ff -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory ffmpeg | Out-Null
          Copy-Item "$($bin.FullName)\*.dll", "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" ffmpeg\
          .\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String mp3
      - name: Programı derle (PyInstaller)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name "YouTube MP3"
          --icon paket/ikon.ico --add-data "paket/ikon.ico;."
          --collect-data customtkinter --collect-submodules yt_dlp --hidden-import qrcode
          ytmp3.py
      - name: Kurulum ve taşınabilir paket
        shell: pwsh
        run: |
          $ver = (Select-String -Path ytmp3.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item -Recurse ffmpeg "dist\YouTube MP3\ffmpeg"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSurum=$ver" paket\kurulum.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Recurse "dist\YouTube MP3" YTMP3
          New-Item YTMP3\PORTABLE -ItemType File | Out-Null
          Compress-Archive YTMP3 cikti\YouTubeMP3-Tasinabilir-Windows.zip
          Get-ChildItem cikti
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: cikti/*

  yayin:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dosyalar
          merge-multiple: true
      - name: GitHub sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git show "$TAG:ytmp3.py" > /tmp/ytmp3.py
          python3 - "$VER" <<'P'
          import ast, sys
          kaynak = open("/tmp/ytmp3.py", encoding="utf-8").read()
          agac = ast.parse(kaynak)
          yenilikler = next(ast.literal_eval(d.value) for d in agac.body
                            if isinstance(d, ast.Assign) and getattr(d.targets[0], "id", "") == "YENILIKLER")
          open("notlar.txt", "w").write("\n".join(yenilikler))
          open("notlar.md", "w").write("## Yenilikler\n" + "".join(f"- {y}\n" for y in yenilikler) + """
          ## Hangi dosyayı indirmeliyim?
          - **Windows:** `YouTubeMP3-Kurulum.exe` (kurulum) veya `YouTubeMP3-Tasinabilir-Windows.zip` (USB için)
          - **Pardus / Linux:** `ytmp3_""" + sys.argv[1] + """_all.deb`
          - **Telefon:** Bilgisayardaki programda 📱 Telefon butonuna basıp QR kodu okutun
          """)
          P
          ls -la dosyalar
          gh release create "$TAG" dosyalar/* --title "YouTube MP3 $VER" --notes-file notlar.md
      - name: surum.json güncelle
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          python3 - "$VER" "$TAG" "$GITHUB_REPOSITORY" <<'P'
          import json, sys
          ver, tag, depo = sys.argv[1:]
          dl = f"https://github.com/{depo}/releases/download/{tag}"
          json.dump({
              "surum": ver,
              "notlar": open("notlar.txt").read(),
              "deb": f"{dl}/ytmp3_{ver}_all.deb",
              "py": f"https://raw.githubusercontent.com/{depo}/{tag}/ytmp3.py",
              "exe_kurulum": f"{dl}/YouTubeMP3-Kurulum.exe",
              "exe_tasinabilir": f"{dl}/YouTubeMP3-Tasinabilir-Windows.zip",
          }, open("surum.json", "w"), ensure_ascii=False, indent=2)
          P
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surum.json
          git commit -m "surum.json: $VER"
          git push origin main
